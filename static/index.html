<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GymBot — Your Fitness Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d0d0f;
    --surface:  #161618;
    --border:   #2a2a2e;
    --accent:   #e8f53a;
    --accent2:  #ff4d1c;
    --text:     #f0f0f0;
    --muted:    #888;
    --user-bg:  #e8f53a;
    --user-txt: #0d0d0f;
    --bot-bg:   #1e1e21;
    --radius:   14px;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ── Subtle grid background ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(232,245,58,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,245,58,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .shell {
    position: relative; z-index: 1;
    width: 100%; max-width: 720px;
    height: 100vh;
    display: flex; flex-direction: column;
    padding: 0 16px;
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 22px 0 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo-mark {
    width: 44px; height: 44px;
    background: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--bg);
    flex-shrink: 0;
    box-shadow: 0 0 20px rgba(232,245,58,0.3);
  }

  .header-info h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 1px;
    line-height: 1;
  }

  .header-info p {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4ade80;
    display: inline-block;
    margin-right: 5px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  /* ── Suggestions ── */
  .suggestions {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 14px 0 6px;
    flex-shrink: 0;
  }

  .chip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232,245,58,0.05);
  }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 0 6px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    animation: fadeUp 0.3s ease both;
  }

  .msg-row.user  { flex-direction: row-reverse; }
  .msg-row.bot   { flex-direction: row; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }

  .avatar.bot-av {
    background: var(--accent);
    color: var(--bg);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
  }

  .avatar.user-av {
    background: var(--border);
    font-size: 15px;
  }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .msg-row.user .bubble {
    background: var(--user-bg);
    color: var(--user-txt);
    border-bottom-right-radius: 4px;
    font-weight: 500;
  }

  .msg-row.bot .bubble {
    background: var(--bot-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .intent-tag {
    font-size: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.7;
    margin-top: 5px;
    font-weight: 600;
  }

  /* ── Typing dots ── */
  .typing-bubble {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-bottom-left-radius: 4px;
    padding: 14px 18px;
    display: flex; gap: 5px; align-items: center;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30%            { transform: translateY(-6px); background: var(--accent); }
  }

  /* ── Input bar ── */
  .input-area {
    padding: 14px 0 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-row {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px 8px 8px 16px;
    transition: border-color 0.2s;
  }

  .input-row:focus-within {
    border-color: rgba(232,245,58,0.4);
    box-shadow: 0 0 0 3px rgba(232,245,58,0.07);
  }

  #userInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14.5px;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
    padding: 4px 0;
  }

  #userInput::placeholder { color: var(--muted); }

  #sendBtn {
    width: 42px; height: 42px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--bg);
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s, background 0.15s;
  }

  #sendBtn:hover  { background: #d4e034; transform: scale(1.05); }
  #sendBtn:active { transform: scale(0.96); }

  #sendBtn svg { width: 18px; height: 18px; }

  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    opacity: 0.6;
  }

  /* ── Welcome state ── */
  .welcome {
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
    padding: 40px 20px 20px;
    gap: 10px;
  }

  .welcome-icon {
    font-size: 48px;
    margin-bottom: 6px;
    filter: drop-shadow(0 0 20px rgba(232,245,58,0.4));
  }

  .welcome h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 1px;
  }

  .welcome p { color: var(--muted); font-size: 14px; max-width: 340px; line-height: 1.6; }

  @media (max-width: 480px) {
    .bubble { max-width: 92%; }
    .suggestions { gap: 6px; }
    .chip { font-size: 11px; padding: 4px 12px; }
  }
</style>
</head>
<body>
<div class="shell">

  <!-- Header -->
  <header>
    <div class="logo-mark">GB</div>
    <div class="header-info">
      <h1>GymBot</h1>
      <p><span class="status-dot"></span>Online · BERT-Powered Assistant</p>
    </div>
  </header>

  <!-- Quick suggestions -->
  <div class="suggestions" id="suggestions">
    <button class="chip" onclick="sendChip(this)">📅 Class schedule</button>
    <button class="chip" onclick="sendChip(this)">🕐 Gym timings</button>
    <button class="chip" onclick="sendChip(this)">💳 Membership fee</button>
    <button class="chip" onclick="sendChip(this)">🎉 Current offers</button>
    <button class="chip" onclick="sendChip(this)">🏋️ Facilities</button>
    <button class="chip" onclick="sendChip(this)">🎯 Trainer info</button>
    <button class="chip" onclick="sendChip(this)">📍 Location</button>
    <button class="chip" onclick="sendChip(this)">📞 Contact info</button>
  </div>

  <!-- Chat messages -->
  <div id="messages">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🏋️</div>
      <h2>Welcome to GymBot</h2>
      <p>Ask me anything about our gym — hours, memberships, classes, pricing, and more.</p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea id="userInput" placeholder="Ask me anything about the gym…" rows="1"></textarea>
      <button id="sendBtn" onclick="sendMessage()" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <p class="hint">Powered by BERT · Press Enter to send</p>
  </div>

</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('userInput');
  const welcomeEl  = document.getElementById('welcome');
  let   welcomed   = true;

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function sendChip(btn) {
    const text = btn.textContent.replace(/^[^\s]+\s/, '').trim();
    inputEl.value = text;
    sendMessage();
  }

  function appendMessage(role, text, intent) {
    if (welcomed) { welcomeEl.remove(); welcomed = false; }
    const row    = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = role === 'user' ? 'avatar user-av' : 'avatar bot-av';
    avatar.textContent = role === 'user' ? '👤' : 'GB';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    if (role === 'bot' && intent) {
      const tag = document.createElement('div');
      tag.className = 'intent-tag';
      tag.textContent = '⚡ ' + intent.replace(/_/g, ' ');
      bubble.appendChild(tag);
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function showTyping() {
    if (welcomed) { welcomeEl.remove(); welcomed = false; }
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing';

    const avatar = document.createElement('div');
    avatar.className = 'avatar bot-av';
    avatar.textContent = 'GB';

    const tb = document.createElement('div');
    tb.className = 'typing-bubble';
    tb.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    row.appendChild(avatar);
    row.appendChild(tb);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    appendMessage('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';

    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      removeTyping();
      appendMessage('bot', data.reply, data.intent);
    } catch (err) {
      removeTyping();
      appendMessage('bot', '⚠️ Could not reach the server. Make sure your Flask backend is running.', null);
    }
  }
</script>
</body>
</html>
